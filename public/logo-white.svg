<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="m-left-grad-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389BFF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="m-right-grad-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2684FF" />
      <stop offset="100%" stop-color="#003D99" />
    </linearGradient>
    <linearGradient id="m-center-grad-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="node-glow-w" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Geometric 3D 'M' Facets -->
  <g id="m-geometry-w">
    <polygon points="140,90 205,150 205,370 140,430" fill="url(#m-left-grad-w)" />
    <polygon points="205,150 300,320 300,210 205,90" fill="url(#m-center-grad-w)" opacity="0.95" />
    <polygon points="205,150 300,320 205,370" fill="#0040A8" />
    <polygon points="395,150 300,320 300,210 395,90" fill="url(#m-center-grad-w)" opacity="0.9" />
    <polygon points="395,150 300,320 395,370" fill="#003580" />
    <polygon points="460,90 395,150 395,370 460,430" fill="url(#m-right-grad-w)" />
  </g>

  <!-- Constellation Network Nodes & Links -->
  <g id="network-constellation-w" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <line x1="180" y1="210" x2="230" y2="190" />
    <line x1="230" y1="190" x2="255" y2="260" />
    <line x1="230" y1="190" x2="300" y2="245" />
    <line x1="180" y1="210" x2="255" y2="260" />
    <line x1="255" y1="260" x2="300" y2="245" />
    <line x1="300" y1="245" x2="370" y2="225" />
    <line x1="370" y1="225" x2="410" y2="160" />
    <line x1="300" y1="245" x2="390" y2="245" />
    <line x1="390" y1="245" x2="435" y2="245" />
    <line x1="410" y1="160" x2="390" y2="245" />

    <g fill="#FFFFFF" filter="url(#node-glow-w)">
      <circle cx="180" cy="210" r="7" />
      <circle cx="230" cy="190" r="8" />
      <circle cx="255" cy="260" r="7" />
      <circle cx="300" cy="245" r="7.5" />
      <circle cx="370" cy="225" r="8" />
      <circle cx="410" cy="160" r="7" />
      <circle cx="390" cy="245" r="6" />
      <circle cx="435" cy="245" r="7" />
    </g>
  </g>

  <!-- Typography: White MIHORA and Electric TECH -->
  <g id="typography-w">
    <text x="300" y="505" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="6" fill="#FFFFFF">MIHORA</text>
    <line x1="80" y1="545" x2="210" y2="545" stroke="#389BFF" stroke-width="4.5" stroke-linecap="round" />
    <text x="300" y="555" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="12" fill="#389BFF">TECH</text>
    <line x1="390" y1="545" x2="520" y2="545" stroke="#389BFF" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
