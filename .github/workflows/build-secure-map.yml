name: Build Secure Resource Map Shards

on:
  workflow_dispatch:

jobs:
  build-shards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate RLH and encrypted shards
        env:
          RESOURCE_MAP_ENCRYPTION_KEY: ${{ secrets.RESOURCE_MAP_ENCRYPTION_KEY }}
          RLH_MASTER_SECRET: ${{ secrets.RLH_MASTER_SECRET }}
        run: |
          set -e
          npm run generate
          npm run audit-public
